spring.application.name=eva3fullstack
server.port=8080

# Conexión a MySQL de Laragon (puerto 3306, usuario root, sin contraseña)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/gamerzone_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

FRONTEND_URL=http://localhost:5173

# Configuración JWT
jwt.secret=ClaveSecretaSuperSeguraParaGamerZoneEva3Fullstack2026DebeTener32BytesMinimo
jwt.expiration=86400000