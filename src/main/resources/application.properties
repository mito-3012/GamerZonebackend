spring.application.name=eva3fullstack
server.port=8080

# Conexión a MySQL de Laragon (en local usa 127.0.0.1:3306; en Docker permite pasar DB_HOST=host.docker.internal)
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/gamerzone_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Frontend URL
FRONTEND_URL=${FRONTEND_URL:http://localhost:5173}

# Configuración JWT (mínimo 32 caracteres para HS256)
jwt.secret=${JWT_SECRET:ClaveSecretaSuperSeguraParaGamerZoneEva3Fullstack2026DebeTener32BytesMinimo}
jwt.expiration=86400000