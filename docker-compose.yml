services:
  backend:
    build: .
    container_name: gamerzone-backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
